<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Project</title>
    </head>

    <body>
        <canvas id="fx-bg"></canvas>

        <div class="fx-accordion">
            <div class="fx-item active">
                <button class="fx-header">
                    <span>Quantum Interface</span>
                    <i class="fx-icon">+</i>
                </button>
                <div class="fx-content">
                    <p>A next-gen UI layer powered by smooth motion, light distortion and reactive geometry.</p>
                </div>
            </div>

            <div class="fx-item">
                <button class="fx-header">
                    <span>Neural Animations</span>
                    <i class="fx-icon">+</i>
                </button>
                <div class="fx-content">
                    <p>Motion that adapts to user intent, speed and interaction context.</p>
                </div>
            </div>

            <div class="fx-item">
                <button class="fx-header">
                    <span>Energy Core</span>
                    <i class="fx-icon">+</i>
                </button>
                <div class="fx-content">
                    <p>Dynamic glow, particles, and pulse effects synced with UI state.</p>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

        <script type="module" src="./assets/js/main.js"></script>
    </body>
</html>
